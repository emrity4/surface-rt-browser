name: Package Apotheosis Browser

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest release
        id: rel
        run: |
          RELEASE=$(curl -sL "https://api.github.com/repos/MoonlightLabCN/Project-Apotheosis/releases/latest")
          TAG=$(echo "$RELEASE" | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          APPX_URL=$(echo "$RELEASE" | python3 -c "import json,sys; [print(a['browser_download_url']) for a in json.load(sys.stdin)['assets'] if a['name'].endswith('_ARM.appx')]" | head -1)
          CER_URL=$(echo "$RELEASE" | python3 -c "import json,sys; [print(a['browser_download_url']) for a in json.load(sys.stdin)['assets'] if a['name'].endswith('_ARM.cer')]" | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "appx_url=$APPX_URL" >> "$GITHUB_OUTPUT"
          echo "cer_url=$CER_URL" >> "$GITHUB_OUTPUT"

      - name: Download assets
        run: |
          mkdir -p out
          curl -sL "${{ steps.rel.outputs.appx_url }}" -o "out/Apotheosis_${{ steps.rel.outputs.tag }}_ARM.appx"
          curl -sL "${{ steps.rel.outputs.cer_url }}" -o "out/Apotheosis_${{ steps.rel.outputs.tag }}_ARM.cer"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apotheosis-arm
          path: out/
          if-no-files-found: error