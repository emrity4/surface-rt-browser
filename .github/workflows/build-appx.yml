name: Build Optimized Apotheosis

on:
  workflow_dispatch:

jobs:
  optimize:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download latest release
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/MoonlightLabCN/Project-Apotheosis/releases/latest"
          $tag = $release.tag_name
          $appxAsset = ($release.assets | Where-Object { $_.name -match '_ARM\.appx$' })[0]
          $cerAsset = ($release.assets | Where-Object { $_.name -match '_ARM\.cer$' })[0]

          Invoke-WebRequest $appxAsset.browser_download_url -OutFile "$PWD\input.appx"
          Invoke-WebRequest $cerAsset.browser_download_url -OutFile "$PWD\input.cer"
          echo "TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "Downloaded $tag ($([math]::Round($appxAsset.size/1MB,1)) MB)"

      - name: Extract, optimize certs, repackage
        shell: pwsh
        run: |
          # Locate tools
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter "makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx -or -not $signtool) { throw "SDK tools not found" }

          # Unpack
          & $makeappx unpack /p "$PWD\input.appx" /d "$PWD\unpacked" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx unpack failed" }

          # Update cacert.pem (biggest compatibility win — old certs = TLS errors)
          $cacert = "$PWD\unpacked\cacert.pem"
          if (Test-Path $cacert) {
            $oldHash = (Get-FileHash $cacert -Algorithm MD5).Hash
            Invoke-WebRequest "https://curl.se/ca/cacert.pem" -OutFile $cacert
            $newHash = (Get-FileHash $cacert -Algorithm MD5).Hash
            Write-Host "cacert.pem updated: $oldHash -> $newHash"
          } else {
            Write-Host "No cacert.pem found, skipping"
          }

          # Strip debug/test files if any
          Get-ChildItem "$PWD\unpacked" -Recurse -Filter "*.pdb" | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$PWD\unpacked" -Recurse -Filter "*.pdb" | ForEach-Object { Write-Host "Stripped: $($_.Name)" }

          # Repack
          & $makeappx pack /d "$PWD\unpacked" /p "$PWD\optimized.appx" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed" }

          # Create signing cert
          # ponytail: dev cert for sideloading, not a real secret
          $pw = "ApotheosisSideload"
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Apotheosis ARM Publisher" `
            -KeyUsage DigitalSignature -KeyExportPolicy Exportable `
            -CertStoreLocation Cert:\LocalMachine\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
            -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(5)
          Export-PfxCertificate -Cert $cert -FilePath "$PWD\build.pfx" `
            -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath "$PWD\build.cer" | Out-Null

          # Sign
          & $signtool sign /a /fd SHA256 /f "$PWD\build.pfx" /p $pw "$PWD\optimized.appx"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

          $oldSize = [math]::Round((Get-Item "$PWD\input.appx").Length/1MB,1)
          $newSize = [math]::Round((Get-Item "$PWD\optimized.appx").Length/1MB,1)
          Write-Host "Optimized: $oldSize MB -> $newSize MB"

          # Rename to unofficial branding
          Rename-Item "$PWD\optimized.appx" "$PWD\UnofficialApotheosis_$env:TAG_ARM.appx"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apotheosis-optimized
          path: |
            UnofficialApotheosis_*.appx
            build.cer
          if-no-files-found: error